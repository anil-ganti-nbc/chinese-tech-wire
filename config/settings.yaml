# Chinese Tech Wire V0.1 Configuration
# Edit freely without touching code.

polling:
  default_interval_minutes: 5
  prevent_overlap: true
  sources:
    ithome: 3
    mydrivers: 5
    expreview: 5
    zol: 7
    jiwei: 5
    benchlife: 5
    hkepc: 7
    technews: 5
    xfastest: 5

http:
  timeout_seconds: 20
  max_retries: 3
  backoff_factor: 1.5
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 ChineseTechWire/0.1"
  rate_limit_per_domain_seconds: 2.0
  random_delay_min: 0.3
  random_delay_max: 1.2

notification:
  # Legacy per-article Discord path (opt-in only). StoryLead alerts are primary.
  enable_article_alerts: false
  priority_threshold: 70
  high_priority_threshold: 90
  dry_run: false

scoring:
  relevance_weight: 0.45
  novelty_weight: 0.35
  source_quality_weight: 0.10
  freshness_weight: 0.10
  # Bonuses (added after weighted sum, then clamp 0-100)
  bonuses:
    benchmark: 8
    retail_listing: 10
    regulatory: 12
    engineering_sample: 15
    new_specs: 10
    new_price: 8
    new_launch_date: 10
    leak: 7

source_quality:
  ithome: 0.85
  mydrivers: 0.80
  expreview: 0.90
  zol: 0.70
  jiwei: 0.88
  benchlife: 0.88
  hkepc: 0.85
  technews: 0.87
  xfastest: 0.82

